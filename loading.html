<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Preparing your lesson — Learn Anything</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/courses.css">
</head>
<body class="la-app" data-page="loading">

<div class="la-loading" id="la-loading" role="status" aria-live="polite">
  <div class="la-loading-in">
    <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
      <defs>
        <clipPath id="mk-back"><rect x="-20" y="-28" width="104" height="60"/></clipPath>
        <clipPath id="mk-front"><rect x="-20" y="32" width="104" height="60"/></clipPath>
      </defs>
      <g transform="rotate(-18 32 32)" clip-path="url(#mk-back)">
        <ellipse cx="32" cy="32" rx="27" ry="8" fill="none" stroke="#8DB6FF" stroke-width="3.2"/>
        <circle r="3.4" fill="#F2A14F" stroke="#fff" stroke-width="1.2"><animateMotion dur="3.2s" repeatCount="indefinite" path="M59 32 A27 8 0 1 1 5 32 A27 8 0 1 1 59 32"/></circle>
      </g>
      <circle cx="32" cy="32" r="15" fill="#0F62E6"/>
      <g transform="rotate(-18 32 32)" clip-path="url(#mk-front)">
        <ellipse cx="32" cy="32" rx="27" ry="8" fill="none" stroke="#8DB6FF" stroke-width="3.2"/>
        <circle r="3.4" fill="#F2A14F" stroke="#fff" stroke-width="1.2"><animateMotion dur="3.2s" repeatCount="indefinite" path="M59 32 A27 8 0 1 1 5 32 A27 8 0 1 1 59 32"/></circle>
      </g>
    </svg>
    <h1 class="la-display">Preparing your lesson</h1>
    <p class="la-sub">The Pinch Grip · about ten seconds</p>
    <div class="la-bar" role="progressbar" aria-label="Generating"><i></i></div>
    <ol class="la-steps-l">
      <li>Reading the lesson plan</li>
      <li>Writing the explanation</li>
      <li>Designing the visuals</li>
      <li>Preparing the narration</li>
    </ol>
    <p class="la-tip">Teaching a topic out loud is the fastest way to learn it.</p>
  </div>
</div>

<script src="assets/courses.js"></script>
</body>
</html>
